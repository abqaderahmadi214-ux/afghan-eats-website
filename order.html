<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order | Afghan Eats</title><link rel="stylesheet" href="/assets/styles.css"><script src="/config.js"></script></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">AE</span>Afghan Eats</a><div class="actions"><button class="lang" onclick="toggleLang()">دری</button><a class="btn btn-light" href="/orders.html" data-i18n="orders"></a></div></div></header><main class="section soft"><div class="container"><div class="timeline"><h1 data-i18n="track"></h1><div id="orderMeta" class="notice"></div><div id="timelineSteps"></div></div></div></main><script src="/assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');let o=null;if(id){try{o=await trpcQuery('orders.getById',{orderId:id})}catch(e){console.warn(e)}}if(!o)o=JSON.parse(localStorage.getItem('ae_last_order')||'null');const meta=document.getElementById('orderMeta');if(!o){meta.textContent='Order details are not available on this device.';return}meta.innerHTML=`<b>${o.order_number||o.orderNumber||'Order'}</b><br>${o.restaurantName||''}${o.total?` · ${money(o.total)}`:''}`;const statuses=['placed','confirmed','preparing','ready_for_pickup','picked_up','on_the_way','delivered'],labels={placed:t('accepted'),confirmed:t('accepted'),preparing:t('preparing'),ready_for_pickup:'Ready for pickup',picked_up:t('picked'),on_the_way:t('way'),delivered:t('delivered')},current=o.status||'placed',ci=Math.max(0,statuses.indexOf(current));document.getElementById('timelineSteps').innerHTML=statuses.map((s,i)=>`<div class="step ${i<ci?'done':i===ci?'active':''}"><div class="dot">${i<ci?'✓':i+1}</div><div><h3>${labels[s]||s}</h3></div></div>`).join('')});</script></body></html>
