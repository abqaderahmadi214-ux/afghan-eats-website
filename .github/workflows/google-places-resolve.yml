name: Google Places coordinate resolver

on:
  pull_request:
    paths:
      - 'netlify/functions/places-resolve.mjs'
      - '.github/workflows/google-places-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve preview URL
        id: preview
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--afghaneats.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://deploy-preview-96--afghaneats.netlify.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch verified Google Places matches
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.preview.outputs.url }}/.netlify/functions/places-resolve"
          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30"
            code=$(curl -sS -o places-resolution.json -w '%{http_code}' --connect-timeout 10 --max-time 120 "$url" || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
import json
p=json.load(open('places-resolution.json',encoding='utf-8'))
print(json.dumps(p.get('counts',{}),indent=2))
print('apiError:', p.get('apiError'))
print('resolved:', sum(1 for x in p.get('results',[]) if x.get('status')=='resolved'))
print('unresolved:', sum(1 for x in p.get('results',[]) if x.get('status')!='resolved'))
PY
              exit 0
            fi
            echo "HTTP $code; preview may still be deploying"
            sleep 15
          done
          echo "Resolver preview did not return 200" >&2
          cat places-resolution.json >&2 || true
          exit 1

      - name: Upload Places result
        uses: actions/upload-artifact@v4
        with:
          name: google-places-resolution
          path: places-resolution.json
          if-no-files-found: error
          retention-days: 1
