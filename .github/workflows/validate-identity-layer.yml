name: Validate repaired identity layer

on:
  push:
    branches: [fix/identity-init-ready-state]
    paths:
      - '.github/workflows/validate-identity-layer.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-init-ready-state
      - name: JavaScript syntax
        run: node --check assets/identity.js
      - name: Identity contract checks
        run: |
          grep -q 'identity.customerEmailLogin' assets/identity.js
          grep -q 'identity.customerGoogle' assets/identity.js
          grep -q 'identity.riderEmailLogin' assets/identity.js
          grep -q 'identity.riderGoogleLogin' assets/identity.js
          grep -q 'document.readyState === "loading"' assets/identity.js
          grep -q 'DOMContentLoaded' assets/identity.js
      - name: Remove one-shot validator
        run: |
          rm -f .github/workflows/validate-identity-layer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-identity-layer.yml
          git commit -m "Remove one-shot identity validator"
          git push origin HEAD:fix/identity-init-ready-state
