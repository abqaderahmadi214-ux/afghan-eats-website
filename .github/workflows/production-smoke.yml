name: Production Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify final frontend release is live
        shell: bash
        run: |
          set -euo pipefail
          retry_contains() {
            local url="$1" needle="$2" out="$3"
            for attempt in $(seq 1 30); do
              echo "Attempt ${attempt}/30: ${url}"
              if curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$url" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  return 0
                fi
              fi
              sleep 20
            done
            echo "Expected production marker not found: ${needle}" >&2
            echo "Last response (first 120 lines):" >&2
            sed -n '1,120p' "$out" >&2 || true
            return 1
          }

          retry_contains "https://afghaneats.net/config.js" "loadLaunchReadinessV40" /tmp/ae-config.js
          retry_contains "https://afghaneats.net/assets/launch-readiness.js" "launchReadiness.snapshot" /tmp/ae-launch.js
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            retry_contains "https://afghaneats.net/config.js" "prepareCustomerLocale" /tmp/ae-config-v44.js
            retry_contains "https://afghaneats.net/assets/app.js" "requestDeliveryQuote" /tmp/ae-app-v44.js
            retry_contains "https://afghaneats.net/checkout.html" "deliveryQuotePanel" /tmp/ae-checkout-v44.html
            retry_contains "https://afghaneats.net/assets/app.js" "renderConnectivityState" /tmp/ae-app-v45.js
            retry_contains "https://afghaneats.net/checkout.html" "savedAddressChoices" /tmp/ae-checkout-v45.html
            retry_contains "https://afghaneats.net/assets/app.js" "directoryContactMarkup" /tmp/ae-app-v46.js
            retry_contains "https://afghaneats.net/data/public-herat-directory.json" "jumeirah-fast-food-herat" /tmp/ae-directory-v46.json
            retry_contains "https://afghaneats.net/admin-reset.html" "adminResetForm" /tmp/ae-admin-reset-v47.html
            retry_contains "https://afghaneats.net/assets/operations.js" "resetAdminPassword" /tmp/ae-operations-v47.js
            retry_contains "https://afghaneats.net/claim.html" "restaurantClaimForm" /tmp/ae-claim-v48.html
            retry_contains "https://afghaneats.net/assets/claims.js" "adminCreateClaimInvite" /tmp/ae-claims-v48.js
            retry_contains "https://afghaneats.net/owner.html" "ownerItemForm" /tmp/ae-owner-v49.html
            retry_contains "https://afghaneats.net/assets/portal.js" "ownerUpsertMenuItem" /tmp/ae-portal-v49.js
          fi

      - name: Verify frontend production security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats.net/ | tr -d '\r' > /tmp/frontend-headers
          cat /tmp/frontend-headers
          grep -qi '^content-security-policy:' /tmp/frontend-headers
          grep -qi '^strict-transport-security:' /tmp/frontend-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/frontend-headers
          grep -qi '^x-frame-options: DENY' /tmp/frontend-headers

          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats.net/config.js | tr -d '\r' > /tmp/config-headers
          if grep -qi '^cache-control:.*immutable' /tmp/config-headers; then
            echo 'config.js must not use immutable caching' >&2
            exit 1
          fi

      - name: Verify live API health and v40 route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "API health attempt ${attempt}/30"
            if curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 https://afghaneats-api.onrender.com/health -o /tmp/health.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          required={
              'status':'ok',
              'service':'Afghan Eats API',
              'database':'connected',
              'securityHardening':'ready',
              'observability':'ready',
              'dataPortability':'ready',
              'inventory':'transactional_opt_in',
              'adminPasswordRecovery':'ready',
              'restaurantConsolidation':'ready',
              'restaurantClaims':'ready',
              'ownerStudio':'ready',
              'ownerMenuManagement':'create_edit_archive',
              'ownerWeeklyHours':'ready',
              'ownerChangeAudit':'ready',
          }
          bad={k:(d.get(k),v) for k,v in required.items() if d.get(k)!=v}
          if bad:
              raise SystemExit(f'Health contract mismatch: {bad}')
          print('API health contract passed')
          if int(d.get('directoryListings',0)) < 19:
              raise SystemExit(f"Directory import incomplete: {d.get('directoryListings')}")
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/health.json 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done

          route='https://afghaneats-api.onrender.com/api/trpc/launchReadiness.snapshot?input=%7B%22json%22%3Anull%7D'
          for attempt in $(seq 1 10); do
            code=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/launch-route.json -w '%{http_code}' "$route" || true)
            echo "launchReadiness route HTTP ${code}"
            if [ "$code" = '401' ]; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              cat /tmp/launch-route.json 2>/dev/null || true
              echo 'Expected 401 from existing admin-only v40 launchReadiness route.' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify API response hardening
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats-api.onrender.com/health | tr -d '\r' > /tmp/api-headers
          cat /tmp/api-headers
          grep -qi '^x-request-id:' /tmp/api-headers
          grep -qi '^cache-control:.*no-store' /tmp/api-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/api-headers

      - name: Verify customer delivery quote contract
        shell: bash
        run: |
          set -euo pipefail
          list_url='https://afghaneats-api.onrender.com/api/trpc/restaurants.list?input=%7B%22json%22%3A%7B%7D%7D'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$list_url" -o /tmp/restaurants.json
          restaurant_id=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/restaurants.json'))
          items=data.get('result',{}).get('data',{}).get('json',[])
          item=next((x for x in items if x.get('has_takeaway') is not False),None)
          if not item: raise SystemExit('No pickup-capable restaurant is available for quote verification')
          print(item['id'])
          PY
          )
          quote_url=$(RESTAURANT_ID="$restaurant_id" python - <<'PY'
          import json,os,urllib.parse
          value={'json':{'restaurantId':os.environ['RESTAURANT_ID'],'fulfillment':'pickup'}}
          print('https://afghaneats-api.onrender.com/api/trpc/orders.quote?input='+urllib.parse.quote(json.dumps(value,separators=(',',':'))))
          PY
          )
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$quote_url" -o /tmp/quote.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/quote.json')).get('result',{}).get('data',{}).get('json',{})
          if data.get('fulfillment')!='pickup' or float(data.get('deliveryFee',-1))!=0:
              raise SystemExit(f'Pickup quote contract mismatch: {data}')
          print('Pickup quote contract passed')
          PY

      - name: Verify database-backed restaurant directory
        shell: bash
        run: |
          set -euo pipefail
          list_url='https://afghaneats-api.onrender.com/api/trpc/restaurants.list?input=%7B%22json%22%3A%7B%7D%7D'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$list_url" -o /tmp/restaurants-v48.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/restaurants-v48.json')).get('result',{}).get('data',{}).get('json',[])
          directory=[x for x in data if x.get('listing_mode')=='directory']
          if len(directory)<19:
              raise SystemExit(f'Expected at least 19 database-backed directory listings, found {len(directory)}')
          required=next((x for x in directory if x.get('id')=='jumeirah-fast-food-herat'),None)
          if not required or not required.get('source_url') or len(required.get('phone_numbers') or [])<1:
              raise SystemExit(f'Directory metadata contract mismatch: {required}')
          if required.get('has_delivery') is not False or required.get('has_takeaway') is not False or required.get('status')!='pending':
              raise SystemExit(f'Directory ordering safety mismatch: {required}')
          print('Database-backed directory contract passed')
          PY

      - name: Production verification summary
        run: |
          echo 'Afghan Eats production smoke passed.'
          echo 'Frontend v40 asset: live'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'Frontend v49 owner studio: production verification deferred until merge'
          else
            echo 'Frontend v49 owner studio: live'
          fi
          echo 'Frontend security headers: live'
          echo 'API database health: live'
          echo 'Customer delivery quote contract: live'
          echo 'Database-backed restaurant directory: live'
          echo 'Backend v40 launch-readiness route: live and access-controlled'
          echo 'API hardening headers: live'
