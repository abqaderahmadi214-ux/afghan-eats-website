name: Production Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify final frontend release is live
        shell: bash
        run: |
          set -euo pipefail
          retry_contains() {
            local url="$1" needle="$2" out="$3"
            for attempt in $(seq 1 30); do
              echo "Attempt ${attempt}/30: ${url}"
              if curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$url" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  return 0
                fi
              fi
              sleep 20
            done
            echo "Expected production marker not found: ${needle}" >&2
            echo "Last response (first 120 lines):" >&2
            sed -n '1,120p' "$out" >&2 || true
            return 1
          }

          retry_contains "https://afghaneats.net/config.js" "loadLaunchReadinessV40" /tmp/ae-config.js
          retry_contains "https://afghaneats.net/assets/launch-readiness.js" "launchReadiness.snapshot" /tmp/ae-launch.js
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            retry_contains "https://afghaneats.net/config.js" "prepareCustomerLocale" /tmp/ae-config-v44.js
            retry_contains "https://afghaneats.net/assets/app.js" "requestDeliveryQuote" /tmp/ae-app-v44.js
            retry_contains "https://afghaneats.net/checkout.html" "deliveryQuotePanel" /tmp/ae-checkout-v44.html
            retry_contains "https://afghaneats.net/assets/app.js" "renderConnectivityState" /tmp/ae-app-v45.js
            retry_contains "https://afghaneats.net/assets/app.js" "checkoutRequestKey" /tmp/ae-app-ordering.js
            retry_contains "https://afghaneats.net/checkout.html" "savedAddressChoices" /tmp/ae-checkout-v45.html
            retry_contains "https://afghaneats.net/" "class=\"premium-home\"" /tmp/ae-home-premium.html
            retry_contains "https://afghaneats.net/assets/home-premium.css" "homepage v2" /tmp/ae-home-premium.css
            retry_contains "https://afghaneats.net/" "id=\"heroCarousel\"" /tmp/ae-home-carousel.html
            retry_contains "https://afghaneats.net/assets/hero-carousel.js" "AUTOPLAY_MS = 3500" /tmp/ae-hero-carousel.js
            retry_contains "https://afghaneats.net/" "id=\"cuisinePhotoGrid\"" /tmp/ae-home-cuisine.html
            retry_contains "https://afghaneats.net/assets/cuisine-motion.js" "IntersectionObserver" /tmp/ae-cuisine-motion.js
            retry_contains "https://afghaneats.net/" "support@afghaneats.net" /tmp/ae-footer-support.html
            retry_contains "https://afghaneats.net/" "class=\"brand-emblem\"" /tmp/ae-brand-v3.html
            retry_contains "https://afghaneats.net/assets/app.js" "Order food in Herat" /tmp/ae-app-v3.js
            retry_contains "https://afghaneats.net/restaurants" "restaurant-discovery-bar" /tmp/ae-restaurants-v2.html
            retry_contains "https://afghaneats.net/assets/app.js" "directory-detail-v2" /tmp/ae-restaurant-detail-v2.js
            retry_contains "https://afghaneats.net/assets/merchant.js" "publicOnly" /tmp/ae-merchant-directory-guard.js
            retry_contains "https://afghaneats.net/checkout" "id=\"checkoutIdentity\"" /tmp/ae-checkout-identity.html
            retry_contains "https://afghaneats.net/assets/checkout-membership.js" "Continue as guest" /tmp/ae-checkout-membership.js
            retry_contains "https://afghaneats.net/orders" "id=\"ordersMembership\"" /tmp/ae-orders-member.html
            retry_contains "https://afghaneats.net/assets/orders-hub.js" "Guest ordering" /tmp/ae-orders-hub.js
            retry_contains "https://afghaneats.net/assets/app.js" "browseRestaurantMedia" /tmp/ae-restaurants-app-v2.js
            retry_contains "https://afghaneats.net/" "id=\"customerAndroidDownload\"" /tmp/ae-footer-apps.html
            retry_contains "https://afghaneats.net/" "id=\"customerIosDownload\"" /tmp/ae-footer-apps-ios.html
            retry_contains "https://afghaneats.net/assets/app-downloads.js" "customerAndroidDownload" /tmp/ae-app-downloads.js
            if grep -Fq 'ie.flipdish.br11970' /tmp/ae-footer-apps.html; then
              echo 'Unrelated Flipdish Afghan Eats app link must never appear in the Herat footer.' >&2
              exit 1
            fi
            if grep -Fq 'journey-section' /tmp/ae-home-premium.html || grep -Fq 'Ordering that fits Herat' /tmp/ae-home-premium.html; then
              echo 'Legacy hidden homepage content is still present in production HTML.' >&2
              exit 1
            fi
            retry_contains "https://afghaneats.net/assets/app.js" "directoryContactMarkup" /tmp/ae-app-v46.js
            retry_contains "https://afghaneats.net/data/public-herat-directory.json" "jumeirah-fast-food-herat" /tmp/ae-directory-v46.json
            retry_contains "https://afghaneats.net/admin-reset.html" "adminResetForm" /tmp/ae-admin-reset-v47.html
            retry_contains "https://afghaneats.net/assets/operations.js" "resetAdminPassword" /tmp/ae-operations-v47.js
            retry_contains "https://afghaneats.net/claim.html" "restaurantClaimForm" /tmp/ae-claim-v48.html
            retry_contains "https://afghaneats.net/assets/claims.js" "adminCreateClaimInvite" /tmp/ae-claims-v48.js
            retry_contains "https://afghaneats.net/owner.html" "ownerItemForm" /tmp/ae-owner-v49.html
            retry_contains "https://afghaneats.net/assets/portal.js" "ownerUpsertMenuItem" /tmp/ae-portal-v49.js
            retry_contains "https://afghaneats.net/rider-portal.html" "riderPerformancePanel" /tmp/ae-rider-v50.html
            retry_contains "https://afghaneats.net/assets/portal.js" "lastmile.riderVerifyPin" /tmp/ae-portal-v50.js
            retry_contains "https://afghaneats.net/privacy" "Effective date: 27 August 2026." /tmp/ae-play-privacy.html
            retry_contains "https://afghaneats.net/terms" "Effective date: 27 August 2026." /tmp/ae-play-terms.html
            retry_contains "https://afghaneats.net/data-deletion" "Request account and data deletion" /tmp/ae-play-delete.html
          fi

      - name: Verify frontend production security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats.net/ | tr -d '\r' > /tmp/frontend-headers
          cat /tmp/frontend-headers
          grep -qi '^content-security-policy:' /tmp/frontend-headers
          grep -qi '^strict-transport-security:' /tmp/frontend-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/frontend-headers
          grep -qi '^x-frame-options: DENY' /tmp/frontend-headers

          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats.net/config.js | tr -d '\r' > /tmp/config-headers
          if grep -qi '^cache-control:.*immutable' /tmp/config-headers; then
            echo 'config.js must not use immutable caching' >&2
            exit 1
          fi

      - name: Verify hardened final admin host
        shell: bash
        run: |
          set -euo pipefail
          admin_host='https://afghan-eats-admin.onrender.com'
          for attempt in $(seq 1 20); do
            if curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$admin_host/" -o /tmp/admin-control-center.html \
              && curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$admin_host/assets/control-center.js" -o /tmp/admin-control-center.js \
              && curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$admin_host/health" -o /tmp/admin-health.json \
              && grep -Fq 'Riders & shifts' /tmp/admin-control-center.html \
              && grep -Fq 'riderOperations.adminCreateShift' /tmp/admin-control-center.js \
              && grep -Fq 'market-toggle' /tmp/admin-control-center.js \
              && grep -Fq 'Afghan Eats Control Center' /tmp/admin-health.json; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'Hardened final admin host is not serving the final Control Center.' >&2
              exit 1
            fi
            sleep 15
          done

          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 "$admin_host/" | tr -d '\r' > /tmp/admin-host-headers
          cat /tmp/admin-host-headers
          grep -qi '^content-security-policy:.*frame-ancestors' /tmp/admin-host-headers
          grep -qi '^strict-transport-security:' /tmp/admin-host-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/admin-host-headers
          grep -qi '^x-frame-options: DENY' /tmp/admin-host-headers
          grep -qi '^permissions-policy:.*camera=()' /tmp/admin-host-headers
          grep -qi '^cache-control: no-store' /tmp/admin-host-headers

          live_admin='https://admin.afghaneats.net'
          if curl -fsS --connect-timeout 10 --max-time 25 "$live_admin/assets/control-center.js" -o /tmp/live-admin.js 2>/dev/null \
            && grep -Fq 'riderOperations.adminCreateShift' /tmp/live-admin.js \
            && grep -Fq 'market-toggle' /tmp/live-admin.js; then
            echo 'admin.afghaneats.net is serving the final Control Center release.'
          else
            echo '::warning::admin.afghaneats.net still serves the previous Netlify deployment. The hardened final release is live at afghan-eats-admin.onrender.com and only the custom-domain cutover remains.'
          fi

      - name: Verify live API health and v40 route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "API health attempt ${attempt}/30"
            if curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 https://afghaneats-api.onrender.com/health -o /tmp/health.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          required={
              'status':'ok',
              'service':'Afghan Eats API',
              'database':'connected',
              'securityHardening':'ready',
              'observability':'ready',
              'dataPortability':'ready',
              'inventory':'transactional_opt_in',
              'adminPasswordRecovery':'ready',
              'restaurantConsolidation':'ready',
              'restaurantClaims':'ready',
              'ownerStudio':'ready',
              'ownerMenuManagement':'create_edit_archive',
              'ownerWeeklyHours':'ready',
              'ownerChangeAudit':'ready',
          }
          bad={k:(d.get(k),v) for k,v in required.items() if d.get(k)!=v}
          if bad:
              raise SystemExit(f'Health contract mismatch: {bad}')
          print('API health contract passed')
          if int(d.get('directoryListings',0)) < 19:
              raise SystemExit(f"Directory import incomplete: {d.get('directoryListings')}")
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/health.json 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done

          route='https://afghaneats-api.onrender.com/api/trpc/launchReadiness.snapshot?input=%7B%22json%22%3Anull%7D'
          for attempt in $(seq 1 10); do
            code=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/launch-route.json -w '%{http_code}' "$route" || true)
            echo "launchReadiness route HTTP ${code}"
            if [ "$code" = '401' ]; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              cat /tmp/launch-route.json 2>/dev/null || true
              echo 'Expected 401 from existing admin-only v40 launchReadiness route.' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify API response hardening
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 https://afghaneats-api.onrender.com/health | tr -d '\r' > /tmp/api-headers
          cat /tmp/api-headers
          grep -qi '^x-request-id:' /tmp/api-headers
          grep -qi '^cache-control:.*no-store' /tmp/api-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/api-headers

      - name: Verify customer delivery quote contract
        shell: bash
        run: |
          set -euo pipefail
          list_url='https://afghaneats-api.onrender.com/api/trpc/restaurants.list?input=%7B%22json%22%3A%7B%7D%7D'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$list_url" -o /tmp/restaurants.json
          restaurant_id=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/restaurants.json'))
          items=data.get('result',{}).get('data',{}).get('json',[])
          item=next((x for x in items if x.get('status')=='active' and x.get('has_delivery') is not False and x.get('has_takeaway') is not False),None)
          if not item: raise SystemExit('No active delivery and pickup restaurant is available for quote verification')
          print(item['id'])
          PY
          )
          delivery_quote_url=$(RESTAURANT_ID="$restaurant_id" python - <<'PY'
          import json,os,urllib.parse
          value={'json':{'restaurantId':os.environ['RESTAURANT_ID'],'fulfillment':'delivery','deliveryArea':'Herat City','deliveryAddress':'Herat City'}}
          print('https://afghaneats-api.onrender.com/api/trpc/orders.quote?input='+urllib.parse.quote(json.dumps(value,separators=(',',':'))))
          PY
          )
          pickup_quote_url=$(RESTAURANT_ID="$restaurant_id" python - <<'PY'
          import json,os,urllib.parse
          value={'json':{'restaurantId':os.environ['RESTAURANT_ID'],'fulfillment':'pickup'}}
          print('https://afghaneats-api.onrender.com/api/trpc/orders.quote?input='+urllib.parse.quote(json.dumps(value,separators=(',',':'))))
          PY
          )
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$delivery_quote_url" -o /tmp/delivery-quote.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$pickup_quote_url" -o /tmp/pickup-quote.json
          python - <<'PY'
          import json
          delivery=json.load(open('/tmp/delivery-quote.json')).get('result',{}).get('data',{}).get('json',{})
          pickup=json.load(open('/tmp/pickup-quote.json')).get('result',{}).get('data',{}).get('json',{})
          if delivery.get('fulfillment')!='delivery' or float(delivery.get('deliveryFee',-1))!=50 or float(delivery.get('minimumOrder',-1))!=200 or delivery.get('source')!='zone':
              raise SystemExit(f'Delivery quote contract mismatch: {delivery}')
          if pickup.get('fulfillment')!='pickup' or float(pickup.get('deliveryFee',-1))!=0:
              raise SystemExit(f'Pickup quote contract mismatch: {pickup}')
          print('Delivery and pickup quote contracts passed')
          PY

      - name: Verify database-backed restaurant directory
        shell: bash
        run: |
          set -euo pipefail
          list_url='https://afghaneats-api.onrender.com/api/trpc/restaurants.list?input=%7B%22json%22%3A%7B%7D%7D'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 "$list_url" -o /tmp/restaurants-v48.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/restaurants-v48.json')).get('result',{}).get('data',{}).get('json',[])
          directory=[x for x in data if x.get('listing_mode')=='directory']
          if len(directory)<19:
              raise SystemExit(f'Expected at least 19 database-backed directory listings, found {len(directory)}')
          required=next((x for x in directory if x.get('id')=='jumeirah-fast-food-herat'),None)
          if not required or not required.get('source_url') or len(required.get('phone_numbers') or [])<1:
              raise SystemExit(f'Directory metadata contract mismatch: {required}')
          if required.get('has_delivery') is not False or required.get('has_takeaway') is not False or required.get('status')!='pending':
              raise SystemExit(f'Directory ordering safety mismatch: {required}')
          print('Database-backed directory contract passed')
          PY

      - name: Production verification summary
        run: |
          echo 'Afghan Eats production smoke passed.'
          echo 'Frontend v40 asset: live'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'Frontend v50 rider workspace: production verification deferred until merge'
          else
            echo 'Frontend v50 rider workspace: live'
          fi
          echo 'Frontend security headers: live'
          echo 'API database health: live'
          echo 'Customer delivery quote contract: live'
          echo 'Database-backed restaurant directory: live'
          echo 'Backend v40 launch-readiness route: live and access-controlled'
          echo 'API hardening headers: live'
