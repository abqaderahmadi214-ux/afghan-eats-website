name: Char Fasl WhatsApp Diagnostic
on:
  push:
    branches:
      - diagnostic/char-fasl-whatsapp
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/char-fasl-whatsapp-diag.mjs
