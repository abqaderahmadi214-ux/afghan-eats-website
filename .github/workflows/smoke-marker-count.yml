name: Smoke Marker Count
on:
  push:
    branches:
      - diagnostic/smoke-assertion-audit
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-marker-count.mjs
