name: Final Production Verification
on:
  push:
    branches:
      - diagnostic/final-production-verification-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live production verification
        run: xvfb-run -a node scripts/final-production-verification.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-verification
          path: final-production-verification/
          retention-days: 14
