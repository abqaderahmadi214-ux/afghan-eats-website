name: Control Center syntax

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check admin-control-center/assets/control-center.js
      - run: node --check admin-control-center/server.mjs
