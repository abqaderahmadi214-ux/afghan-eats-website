name: Control Center syntax

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check admin-control-center/assets/control-center.js
      - run: node --check admin-control-center/server.mjs

      - run: node --check admin-control-center/assets/finance-workspace.js
      - run: node --check admin-control-center/assets/freshness.js
      - run: node tests/premium-foundation.test.mjs
      - run: node --check admin-control-center/assets/csv-export.js
      - run: node tests/experience-release.test.mjs
      - run: node --test tests/rule-workers-ui.test.mjs
      - run: node --check admin-control-center/assets/admin-mfa.js
      - run: node --check admin-control-center/assets/rule-workers.js
