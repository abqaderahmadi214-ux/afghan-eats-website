name: WhatsApp Live Data Check
on:
  push:
    branches:
      - diagnostic/wa-live-data-check
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wa-live-data-check.mjs
