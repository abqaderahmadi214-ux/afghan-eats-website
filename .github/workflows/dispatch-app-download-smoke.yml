name: Dispatch App Download Smoke Fix
on:
  push:
    branches:
      - diagnostic/smoke-reaudit-after-84

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Smoke on app-download marker fix branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/abqaderahmadi214-ux/afghan-eats-website/actions/workflows/production-smoke.yml/dispatches \
            -d '{"ref":"fix/smoke-app-download-markers"}'
          echo "Dispatched Production Smoke for fix/smoke-app-download-markers"
