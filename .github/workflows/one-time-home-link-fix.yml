name: One-time homepage runtime repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-link-fix.yml'

permissions:
  contents: write

jobs:
  repair-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair homepage runtime and load brand styles directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []

          live = Path('assets/live-search.js')
          text = live.read_text(encoding='utf-8')
          updated = text.replace("||`Request failed (${r.status})`}catch(e)", "||`Request failed (${r.status})`)}catch(e)")
          updated = updated.replace('/assets/home-hero-v3.css?v=20260906-6', '/assets/home-hero-v3.css?v=20260907-1')
          if updated != text:
              live.write_text(updated, encoding='utf-8')
              changed.append(str(live))

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          direct = '<link rel="stylesheet" href="/assets/home-hero-v3.css?v=20260907-1"><link rel="stylesheet" href="/assets/home-hero-copy-v4.css?v=20260907-1">'
          if '/assets/home-hero-v3.css?v=20260907-1' not in text:
              marker = '<script src="/config.js?v=20260905-3"></script>'
              text = text.replace(marker, direct + marker)
          text = re.sub(r'href="/index\.html\?rev=\d{8}-\d+" aria-label="Afghan Eats home"', 'href="/index.html?rev=20260907-1" aria-label="Afghan Eats home"', text)
          index.write_text(text, encoding='utf-8')
          changed.append(str(index))

          print('Updated:', ', '.join(changed))
          PY

      - name: Validate repaired JavaScript
        run: node --check assets/live-search.js

      - name: Commit runtime repair
        shell: bash
        run: |
          if git diff --quiet -- assets/live-search.js index.html; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/live-search.js index.html
          git commit -m 'Fix homepage runtime and load hero styles directly'
          git push
