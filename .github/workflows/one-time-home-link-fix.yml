name: One-time homepage link cache fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-link-fix.yml'

permissions:
  contents: write

jobs:
  fix-home-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point customer home links at current versioned homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = '/index.html?rev=20260906-10'
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('href="/"', f'href="{target}"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit homepage navigation fix
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo 'No homepage links needed updating.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Route home links to current homepage build'
          git push
