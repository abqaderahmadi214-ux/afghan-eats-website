name: Trigger Netlify storefront build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: netlify-storefront-build
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build using existing Netlify project configuration
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.NETLIFY_AUTH_TOKEN;
          if (!token) {
            console.error('NETLIFY_AUTH_TOKEN is not configured in GitHub Actions. Trigger the latest main build in the Netlify dashboard, or configure this deployment credential.');
            process.exit(1);
          }
          const response = await fetch('https://api.netlify.com/api/v1/sites/361f7c50-6d97-4bdd-a398-462b02fb29d0/builds', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ clear_cache: false })
          });
          if (!response.ok) {
            console.error(`Netlify build trigger failed with HTTP ${response.status}.`);
            process.exit(1);
          }
          const result = await response.json();
          console.log(`Netlify build requested: ${result.id || 'accepted'}`);
          JS
