name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/advanced.js
          node --check assets/operations.js
          node --check assets/trust.js
          node --check assets/portal.js
          node --check assets/portal-admin.js
          node --check assets/customer.js
          node --check assets/customer-admin.js
          node --check assets/reliability.js
          node --check assets/notifications.js
          node --check assets/communications-admin.js
          node --check assets/security.js
          node --check assets/finance.js
          node --check assets/merchant.js
          node --check assets/merchant-owner.js
          node --check assets/dispatch.js
          node --check assets/lastmile.js
          node --check assets/integrity.js
          node --check assets/platform-status.js
          node --check assets/cities.js
          node --check assets/quality.js
          node --check assets/catalog.js
          node --check assets/live-search.js
          node --check assets/rewards.js
          node --check assets/recovery.js
          node --check assets/group-order.js
          node --check assets/timeline.js
          node --check assets/scheduling.js
          node --check assets/personalization.js
          node --check assets/support-resolution.js
          node --check assets/growth.js
          node --check assets/merchant-finance-v30.js
          node --check assets/compensation.js
          node --check assets/food-safety.js
          node --check assets/kitchen.js
          node --check assets/forecast.js
          node --check assets/inventory.js
          node --check assets/observability.js
          node --check assets/data-readiness.js
          node --check assets/security-posture.js
          node --check config.js
      - name: Validate JSON and local references
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path('.')
          json.load(open(root/'data/fallback-restaurants.json', encoding='utf-8'))
          missing=[]
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:href|src)=["\']([^"\']+)', text):
                  if '${' in ref or ref.startswith(('http://','https://','#','mailto:','tel:','javascript:')):
                      continue
                  path=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if not path or path.endswith('/'):
                      continue
                  if not (root/path).exists():
                      missing.append((page.name,ref))
          if missing:
              print('Missing local references:', missing)
              sys.exit(1)
          print('Frontend validation passed')
          PY
      - name: Security regression checks
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root=pathlib.Path('.')
          netlify=(root/'netlify.toml').read_text(encoding='utf-8')
          problems=[]
          if 'Content-Security-Policy' not in netlify:
              problems.append('Netlify CSP header is missing')
          asset_block=netlify.split('for = "/assets/*"',1)[-1]
          if 'immutable' in asset_block.lower():
              problems.append('Unversioned assets must not use immutable caching')
          patterns=[
              re.compile(r'sk_live_[A-Za-z0-9]{12,}'),
              re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'),
              re.compile(r'(?:SUPABASE_SERVICE_ROLE_KEY|JWT_SECRET|COMMUNICATIONS_PROVIDER_TOKEN)\s*[:=]\s*["\'][^$"\']{12,}["\']',re.I),
          ]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.js','.html','.json','.toml','.md','.txt'}:
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              for rx in patterns:
                  if rx.search(text):
                      problems.append(f'Possible hard-coded secret in {p}')
                      break
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Security regression checks passed')
          PY
