name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Diagnose live admin source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DNS ==="
          getent ahosts admin.afghaneats.net || true
          if command -v dig >/dev/null; then
            echo "CNAME:"; dig +short admin.afghaneats.net CNAME || true
            echo "A:"; dig +short admin.afghaneats.net A || true
          fi
          curl -fsSL --connect-timeout 15 --max-time 45 -D /tmp/admin-headers.txt https://admin.afghaneats.net/ -o /tmp/admin.html
          echo "=== HEADERS ==="; sed -n '1,100p' /tmp/admin-headers.txt
          echo "=== TITLE ==="; grep -Eio '<title>[^<]*</title>' /tmp/admin.html | head -5 || true
          echo "=== REFERENCES ==="; grep -Eo '(src|href)="[^"]+"' /tmp/admin.html | head -120 || true
          echo "=== MARKERS ==="; grep -Eio 'Afghan Eats Control Center|overview|orders|restaurants|riders|shift|dispatch|market|support' /tmp/admin.html | sort | uniq -c || true
          curl -fsSL --connect-timeout 15 --max-time 45 https://admin.afghaneats.net/assets/control-center.js -o /tmp/control-center.js
          curl -fsSL --connect-timeout 15 --max-time 45 https://admin.afghaneats.net/assets/control-center.css -o /tmp/control-center.css
          echo "=== HASH SIZE ==="; sha256sum /tmp/admin.html /tmp/control-center.js /tmp/control-center.css; wc -c /tmp/admin.html /tmp/control-center.js /tmp/control-center.css
          echo "=== JS ROUTES / API MARKERS ==="; grep -Eo '[A-Za-z][A-Za-z0-9]+\.[A-Za-z][A-Za-z0-9]+' /tmp/control-center.js | sort -u | head -200 || true
          echo "=== HTML HEAD ==="; sed -n '1,160p' /tmp/admin.html
      - name: Preserve live admin source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: live-admin-control-center
          path: |
            /tmp/admin.html
            /tmp/control-center.js
            /tmp/control-center.css
          if-no-files-found: error
          retention-days: 1
      - name: Match custom admin domain to likely Netlify site name
        shell: bash
        run: |
          set -euo pipefail
          target_hash=$(curl -fsSL --connect-timeout 10 --max-time 30 https://admin.afghaneats.net/ | sha256sum | awk '{print $1}')
          echo "Target hash: $target_hash"
          for host in admin-afghaneats.netlify.app afghan-eats-admin.netlify.app afghaneats-admin.netlify.app afghaneats-control-center.netlify.app; do
            tmp="/tmp/$host.html"
            if curl -fsSL --connect-timeout 10 --max-time 30 "https://$host/" -o "$tmp" 2>/dev/null; then
              hash=$(sha256sum "$tmp" | awk '{print $1}')
              title=$(grep -Eio '<title>[^<]*</title>' "$tmp" | head -1 || true)
              if [ "$hash" = "$target_hash" ]; then match="MATCH"; else match="different"; fi
              echo "$host | $match | $hash | $title"
            else
              echo "$host | unavailable"
            fi
          done
      - name: Identify connected Netlify admin site without exposing credentials
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "No repository Netlify API token is configured under NETLIFY_AUTH_TOKEN or NETLIFY_TOKEN."
            exit 0
          fi
          echo "A repository Netlify API token is available; listing non-secret site metadata."
          curl -fsSL -H "Authorization: Bearer $token" "https://api.netlify.com/api/v1/sites?per_page=100" -o /tmp/netlify-sites.json
          python - <<'PY'
          import json
          sites=json.load(open('/tmp/netlify-sites.json'))
          for s in sites:
              fields=[
                  str(s.get('id') or ''),
                  str(s.get('name') or ''),
                  str(s.get('url') or ''),
                  str(s.get('ssl_url') or ''),
                  str(s.get('custom_domain') or ''),
                  str((s.get('build_settings') or {}).get('repo_url') or ''),
                  str((s.get('build_settings') or {}).get('repo_branch') or ''),
                  str((s.get('build_settings') or {}).get('dir') or ''),
                  str((s.get('build_settings') or {}).get('cmd') or ''),
              ]
              joined=' | '.join(fields)
              if 'afghan' in joined.lower() or 'admin' in joined.lower():
                  print(joined)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/advanced.js
          node --check assets/operations.js
          node --check assets/trust.js
          node --check assets/portal.js
          node --check assets/portal-admin.js
          node --check assets/customer.js
          node --check assets/customer-admin.js
          node --check assets/reliability.js
          node --check assets/notifications.js
          node --check assets/communications-admin.js
          node --check assets/security.js
          node --check assets/finance.js
          node --check assets/merchant.js
          node --check assets/merchant-owner.js
          node --check assets/dispatch.js
          node --check assets/lastmile.js
          node --check assets/integrity.js
          node --check assets/platform-status.js
          node --check assets/cities.js
          node --check assets/quality.js
          node --check assets/catalog.js
          node --check assets/live-search.js
          node --check assets/rewards.js
          node --check assets/recovery.js
          node --check assets/group-order.js
          node --check assets/timeline.js
          node --check assets/scheduling.js
          node --check assets/personalization.js
          node --check assets/support-resolution.js
          node --check assets/growth.js
          node --check assets/merchant-finance-v30.js
          node --check assets/compensation.js
          node --check assets/food-safety.js
          node --check assets/kitchen.js
          node --check assets/forecast.js
          node --check assets/inventory.js
          node --check assets/observability.js
          node --check assets/data-readiness.js
          node --check assets/security-posture.js
          node --check assets/accessibility.js
          node --check assets/launch-readiness.js
          node --check assets/experience-v43.js
          node --check assets/claims.js
          node --check config.js
      - name: Validate JSON and local references
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path('.')
          json.load(open(root/'data/fallback-restaurants.json', encoding='utf-8'))
          directory=json.load(open(root/'data/public-herat-directory.json', encoding='utf-8'))
          ids=[]
          for entry in directory:
              restaurant=entry.get('restaurant',{})
              rid=restaurant.get('id')
              ids.append(rid)
              if not rid or restaurant.get('listing_mode')!='directory':
                  raise SystemExit(f'Invalid public directory entry: {rid!r}')
              if restaurant.get('status')!='pending' or restaurant.get('has_delivery') is not False or restaurant.get('has_takeaway') is not False:
                  raise SystemExit(f'Public listing must not imply active Afghan Eats ordering: {rid}')
              if not str(restaurant.get('source_url','')).startswith('https://') or not restaurant.get('source_checked_at'):
                  raise SystemExit(f'Public listing source is incomplete: {rid}')
          if len(ids)!=len(set(ids)):
              raise SystemExit('Duplicate restaurant ID in public Herat directory')
          missing=[]
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:href|src)=["\']([^"\']+)', text):
                  if '${' in ref or ref.startswith(('http://','https://','#','mailto:','tel:','javascript:')):
                      continue
                  path=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if not path or path.endswith('/'):
                      continue
                  target=root/path
                  if not target.exists() and not target.with_suffix('.html').exists():
                      missing.append((page.name,ref))
          if missing:
              print('Missing local references:', missing)
              sys.exit(1)
          print('Frontend validation passed')
          PY
      - name: Security regression checks
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root=pathlib.Path('.')
          netlify=(root/'netlify.toml').read_text(encoding='utf-8')
          problems=[]
          if 'Content-Security-Policy' not in netlify:
              problems.append('Netlify CSP header is missing')
          asset_block=netlify.split('for = "/assets/*"',1)[-1]
          if 'immutable' in asset_block.lower():
              problems.append('Unversioned assets must not use immutable caching')
          patterns=[
              re.compile(r'sk_live_[A-Za-z0-9]{12,}'),
              re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'),
              re.compile(r'(?:SUPABASE_SERVICE_ROLE_KEY|JWT_SECRET|COMMUNICATIONS_PROVIDER_TOKEN)\s*[:=]\s*["\'][^$"\']{12,}["\']',re.I),
          ]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.js','.html','.json','.toml','.md','.txt'}:
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              for rx in patterns:
                  if rx.search(text):
                      problems.append(f'Possible hard-coded secret in {p}')
                      break
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Security regression checks passed')
          PY
      - name: Accessibility and performance quality gates
        run: |
          python - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('.')
          problems=[]
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8')
              low=text.lower()
              if not re.search(r'<html[^>]+lang=["\'][^"\']+["\']',text,re.I): problems.append(f'{page}: html lang is missing')
              if '<title>' not in low or '</title>' not in low: problems.append(f'{page}: title is missing')
              if 'name="viewport"' not in low and "name='viewport'" not in low: problems.append(f'{page}: viewport meta is missing')
              if '<main' not in low: problems.append(f'{page}: main landmark is missing')
              ids=re.findall(r'\bid=["\']([^"\']+)',text,re.I)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: problems.append(f'{page}: duplicate ids {dup}')
              for tag in re.findall(r'<img\b[^>]*>',text,re.I):
                  if not re.search(r'\balt\s*=',tag,re.I): problems.append(f'{page}: static image missing alt')
              for tag in re.findall(r'<a\b[^>]*target=["\']_blank["\'][^>]*>',text,re.I):
                  rel=re.search(r'\brel=["\']([^"\']*)',tag,re.I)
                  if not rel or 'noopener' not in rel.group(1).lower(): problems.append(f'{page}: target=_blank link missing noopener')
              if page.stat().st_size>350_000: problems.append(f'{page}: HTML exceeds 350KB budget')
          js=list((root/'assets').glob('*.js'))
          for p in js:
              if p.stat().st_size>350_000: problems.append(f'{p}: JS exceeds 350KB single-file budget')
          if sum(p.stat().st_size for p in js)>2_500_000: problems.append('Total assets/*.js exceeds 2.5MB source budget')
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Accessibility and performance quality gates passed')
          PY
      - name: Install Chromium for the customer journey
        run: npx playwright install --with-deps chromium
      - name: Run customer journey browser tests
        run: npm run test:e2e
