name: Package admin deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-admin-deploy.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify admin control center
        run: |
          node --check admin-control-center/assets/control-center.js
          test -f admin-control-center/index.html
          test -f admin-control-center/assets/control-center.css
      - name: Upload admin control center
        uses: actions/upload-artifact@v4
        with:
          name: admin-control-center-production
          path: admin-control-center/
          include-hidden-files: true
          retention-days: 1
