name: Sticky Header Review
on:
  push:
    branches:
      - diagnostic/premium-design-screenshots
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify sticky header scroll behavior
        run: node scripts/sticky-header-review.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sticky-header-review
          path: sticky-header-review/
          retention-days: 7
