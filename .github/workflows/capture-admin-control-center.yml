name: Capture Admin Control Center Source
on:
  push:
    branches:
      - feature/admin-control-center-rider-ops-v2
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture current live admin source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p admin-control-center/assets
          curl -fsSL --connect-timeout 15 --max-time 45 https://admin.afghaneats.net/ -o admin-control-center/index.html
          curl -fsSL --connect-timeout 15 --max-time 45 https://admin.afghaneats.net/assets/control-center.js -o admin-control-center/assets/control-center.js
          curl -fsSL --connect-timeout 15 --max-time 45 https://admin.afghaneats.net/assets/control-center.css -o admin-control-center/assets/control-center.css
          cat > admin-control-center/_headers <<'EOF'
          /*
            Content-Security-Policy: default-src 'self'; connect-src 'self' https://afghaneats-api.onrender.com; img-src 'self' data: https:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'
            Cross-Origin-Opener-Policy: same-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
            Referrer-Policy: same-origin
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Strict-Transport-Security: max-age=31536000
          EOF
          printf '%s\n' '# Afghan Eats Control Center' '' 'Source-controlled snapshot of the production admin workspace at admin.afghaneats.net.' '' 'Publish this directory as the Netlify site root. No credentials or tokens belong in this directory.' > admin-control-center/README.md
          node --check admin-control-center/assets/control-center.js
      - name: Commit captured source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-control-center
          if git diff --cached --quiet; then
            echo "Admin source already captured."
            exit 0
          fi
          git commit -m "Capture production admin control center source"
          git push origin HEAD:feature/admin-control-center-rider-ops-v2
