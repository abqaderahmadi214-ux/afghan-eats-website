name: Premium Final Review Evidence
on:
  push:
    branches:
      - diagnostic/premium-design-screenshots
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify skip link and visual fixes
        run: node scripts/premium-final-review.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-final-review
          path: premium-final-review/
          retention-days: 7
