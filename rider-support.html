<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Support | Afghan Eats Operations</title><link rel="stylesheet" href="/assets/app.css"><style>
body{background:#f6f8f5}.rs-shell{max-width:1120px;margin:0 auto;padding:32px 18px 64px}.rs-hero{border-radius:26px;background:#0d3828;color:#fff;padding:24px;margin-bottom:18px}.rs-hero h1{margin:6px 0;font-size:28px}.rs-hero p{max-width:680px;color:#d5eadc;margin:0;line-height:1.55}.rs-grid{display:grid;grid-template-columns:minmax(270px,.8fr) minmax(360px,1.2fr);gap:16px}.rs-card{background:#fff;border:1px solid #dce7df;border-radius:20px;padding:16px}.rs-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ee;cursor:pointer}.rs-row:last-child{border-bottom:0}.rs-row.active{margin:0 -8px;padding:13px 8px;border-radius:12px;background:#eff8f1}.rs-label{font-weight:800}.rs-meta{font-size:12px;color:#66736b;margin-top:3px}.rs-chip{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef6f0;color:#19633f}.rs-thread{min-height:420px;display:flex;flex-direction:column;gap:10px}.rs-message{max-width:82%;border-radius:16px;padding:11px 13px;line-height:1.45}.rs-message.rider{align-self:flex-start;background:#f0f3f1}.rs-message.admin{align-self:flex-end;background:#0d6241;color:#fff}.rs-message .rs-meta{color:inherit;opacity:.7;margin-top:5px}.rs-compose{display:grid;gap:9px;margin-top:14px}.rs-compose textarea{width:100%;min-height:100px;box-sizing:border-box;border-radius:14px;border:1px solid #cfdcd3;padding:11px;font:inherit}.rs-actions{display:flex;gap:8px;flex-wrap:wrap}.rs-error{color:#a52323;margin-top:8px}.rs-empty{padding:30px 12px;text-align:center;color:#66736b}.rs-auth{max-width:620px;margin:80px auto;background:#fff;border:1px solid #dce7df;border-radius:22px;padding:28px} @media(max-width:760px){.rs-grid{grid-template-columns:1fr}.rs-shell{padding-top:18px}}
</style></head><body><main id="app"></main><script src="/assets/app.js"></script><script>
(() => { const root=document.getElementById('app'); const token=sessionStorage.getItem('ae_admin_token')||''; const config=window.AFGHAN_EATS_CONFIG||{}; const base=config.apiBaseUrl||''; let selected=null, queue=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const time=v=>v?new Intl.DateTimeFormat('en',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'';
async function request(path,input,method='GET'){if(!token)throw new Error('An authenticated Operations session is required.');if(!base)throw new Error('API configuration is unavailable.');const headers={Accept:'application/json',Authorization:'Bearer '+token};let url=base+'/api/trpc/'+path,opts={headers};if(method==='GET')url+='?input='+encodeURIComponent(JSON.stringify({json:input??null}));else{headers['Content-Type']='application/json';opts={method:'POST',headers,body:JSON.stringify({json:input})};}const r=await fetch(url,opts),raw=await r.text();if(!r.ok){try{throw new Error(JSON.parse(raw)?.error?.json?.message||'Request failed');}catch(e){throw e instanceof Error?e:new Error(raw||'Request failed');}}const body=JSON.parse(raw);return body?.result?.data?.json??body?.result?.data??body;}
function shell(){if(!token||!base){root.innerHTML='<section class="rs-auth"><h1>Rider Support</h1><p>Sign in through the Afghan Eats Operations console first, then open this staging page from the same browser session.</p></section>';return;}root.innerHTML='<main class="rs-shell"><section class="rs-hero"><div class="rs-chip">STAGING · RIDER OPERATIONS</div><h1>Rider support inbox</h1><p>Authenticated rider messages appear here. Reply only with operational guidance. This queue does not expose customer phone data, and attachments are intentionally unavailable until private media storage is configured.</p></section><div id="status"></div><section class="rs-grid"><aside class="rs-card"><div class="rs-actions"><strong>Open rider conversations</strong><button class="btn btn-secondary" id="refresh">Refresh</button></div><div id="queue" class="rs-empty">Loading…</div></aside><section class="rs-card"><div id="thread" class="rs-empty">Select a rider conversation.</div></section></section></main>';document.getElementById('refresh').onclick=loadQueue;}
async function loadQueue(){const el=document.getElementById('queue');try{queue=await request('riderChat.adminRiderSupportQueue',{});el.innerHTML=queue.length?queue.map(x=>'<div class="rs-row '+(selected===x.id?'active':'')+'" data-id="'+esc(x.id)+'"><div><div class="rs-label">'+esc(x.riderName||x.riderUsername||'Rider')+'</div><div class="rs-meta">'+esc(x.riderUsername||'')+' · '+esc(x.messageCount)+' messages</div></div><div><span class="rs-chip">'+esc(x.status)+'</span><div class="rs-meta">'+time(x.updatedAt)+'</div></div></div>').join(''):'<div class="rs-empty">No rider support conversations yet.</div>';el.querySelectorAll('[data-id]').forEach(node=>node.onclick=()=>openThread(node.dataset.id));}catch(e){el.innerHTML='<div class="rs-error">'+esc(e.message)+'</div>';}}
async function openThread(id){selected=id;const pane=document.getElementById('thread');pane.innerHTML='<div class="rs-empty">Loading conversation…</div>';try{const data=await request('riderChat.adminRiderSupportThread',{id});const t=data.thread;pane.innerHTML='<div class="rs-actions"><div><strong>'+esc(t.riderName||t.riderUsername)+'</strong><div class="rs-meta">'+esc(t.riderUsername||'')+' · '+esc(t.status)+'</div></div><label class="rs-meta">Status <select id="thread-status"><option value="open">Open</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></label><label class="rs-meta"><input id="assign-me" type="checkbox"> Assign to me</label><button class="btn btn-secondary" id="save-thread">Save</button></div><div class="rs-thread" id="messages">'+(data.messages.length?data.messages.map(m=>'<div class="rs-message '+(m.sender==='admin'?'admin':'rider')+'"><div>'+esc(m.body)+'</div><div class="rs-meta">'+esc(m.sender)+' · '+time(m.createdAt)+(m.readAt?' · read':'')+'</div></div>').join(''):'<div class="rs-empty">No messages in this conversation.</div>')+'</div><form class="rs-compose" id="reply"><textarea name="body" maxlength="4000" required placeholder="Reply to rider…"></textarea><div class="rs-actions"><button class="btn btn-primary" type="submit">Send reply</button><span class="rs-meta">Text only. No customer data is attached automatically.</span></div></form>';
document.getElementById('thread-status').value=t.status;document.getElementById('save-thread').onclick=async()=>{await request('riderChat.adminRiderSupportUpdate',{id,status:document.getElementById('thread-status').value,assignToMe:document.getElementById('assign-me').checked},'POST');await openThread(id);await loadQueue();};document.getElementById('reply').onsubmit=async ev=>{ev.preventDefault();const body=new FormData(ev.currentTarget).get('body').trim();if(!body)return;await request('riderChat.adminRiderSupportReply',{id,body},'POST');await openThread(id);await loadQueue();};}catch(e){pane.innerHTML='<div class="rs-error">'+esc(e.message)+'</div>';}}
shell();if(token&&base)loadQueue();})();
</script></body></html>
