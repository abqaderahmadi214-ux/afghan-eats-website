[build]

  command = "node scripts/inject-google-maps-config.cjs && node scripts/render-association-assets.cjs && node scripts/validate-association-assets.cjs"
  
  publish = "."
  


[[headers]]

  for = "/*"
  
  [headers.values]
  
    X-Frame-Options = "DENY"
    
    X-Content-Type-Options = "nosniff"
    
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    
    Strict-Transport-Security = "max-age=31536000"
    
    X-Permitted-Cross-Domain-Policies = "none"
    
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: https://maps.google.com https://maps.gstatic.com https://maps.googleapis.com https://*.googleapis.com https://*.ggpht.com; connect-src 'self' https://afghaneats-api.onrender.com https://maps.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    


[[headers]]

  for = "/*.html"
  
  [headers.values]
  
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    


[[headers]]

  for = "/config.js"
  
  [headers.values]
  
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    


[[headers]]

  for = "/.well-known/assetlinks.json"
  
  [headers.values]
  
    Content-Type = "application/json; charset=utf-8"
    
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    


[[headers]]

  for = "/.well-known/apple-app-site-association"
  
  [headers.values]
  
    Content-Type = "application/json; charset=utf-8"
    
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    


[[headers]]

  for = "/service-worker.js"
  
  [headers.values]
  
    Cache-Control = "no-store, max-age=0"
    


[[headers]]

  for = "/assets/*"
  
  [headers.values]
  
    Cache-Control = "public, max-age=300, must-revalidate"
    


[[headers]]

  for = "/data/*"
  
  [headers.values]
  
    Cache-Control = "public, max-age=300, must-revalidate"
































