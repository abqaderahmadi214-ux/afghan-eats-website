<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Afghan Eats</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/advanced.css"><script src="/config.js"></script></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">AE</span>Afghan Eats</a><div class="actions"><button class="lang" onclick="toggleLang()">دری</button><a class="btn btn-light" href="/restaurants.html" data-i18n="restaurants"></a></div></div></header><main class="section soft"><div class="container"><div class="section-head"><div><h1 data-i18n="orders"></h1><p class="en-copy">Track recent orders or rebuild a previous basket in one tap.</p><p class="fa-copy">سفارش‌های اخیر را پیگیری کنید یا سبد قبلی را دوباره بسازید.</p></div><span class="advanced-badge">↻ <span class="en-copy">Quick reorder</span><span class="fa-copy">سفارش دوباره</span></span></div><div id="orderHistory"></div><a class="btn btn-primary" href="/restaurants.html" data-i18n="restaurants"></a></div></main><script src="/assets/app.js"></script><script src="/assets/advanced.js"></script><script>function localOrders(){let a=[];try{a=JSON.parse(localStorage.getItem('ae_orders')||'[]')}catch{}if(!Array.isArray(a)||!a.length){try{const x=JSON.parse(localStorage.getItem('ae_last_order')||'null');if(x)a=[x]}catch{}}return a}function reorderLocal(i){const o=localOrders()[i];if(!o||!o.items)return;const rid=o.restaurantId||o.restaurant_id;const c=o.items.map(x=>({id:x.id,restaurantId:rid,restaurantName:o.restaurantName||'',name:x.name||x.name_dari||'Item',price:Number(x.price||0),qty:Number(x.quantity||x.qty||1)})).filter(x=>x.price>0);if(!c.length)return;localStorage.setItem('ae_cart',JSON.stringify(c));location.href='/restaurant.html?id='+encodeURIComponent(rid)}document.addEventListener('DOMContentLoaded',()=>{const host=document.getElementById('orderHistory'),a=localOrders();if(!a.length){host.innerHTML='<div class="notice"><b>No orders yet</b><p>Your recent orders will appear here after checkout.</p></div>';return}host.innerHTML=a.map((o,i)=>{const id=o.orderId||o.id||'',num=o.orderNumber||o.order_number||'Order',date=o.createdAt?new Date(o.createdAt).toLocaleString():'',total=o.pricing?.total??o.total??0,status=o.status||'placed',count=(o.items||[]).reduce((s,x)=>s+Number(x.quantity||x.qty||1),0);return`<div class="order-card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>${num}</b><div class="muted">${o.restaurantName||''}${date?' · '+date:''}</div></div><span class="advanced-badge">${status}</span></div><div class="tracking-summary"><div class="tracking-stat"><small>Total</small><b>${money(total)}</b></div><div class="tracking-stat"><small>Items</small><b>${count}</b></div><div class="tracking-stat"><small>Type</small><b>${o.fulfillment||'delivery'}</b></div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${id?`<a class="btn btn-primary" href="/order.html?id=${encodeURIComponent(id)}">Track</a>`:''}<button class="btn btn-light" onclick="reorderLocal(${i})">Order again</button></div></div>`}).join('')});</script></body></html>
