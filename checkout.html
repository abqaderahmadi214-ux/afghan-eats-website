<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Afghan Eats</title><link rel="stylesheet" href="/assets/styles.css"><script src="/config.js"></script></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">AE</span>Afghan Eats</a><div class="actions"><button class="lang" onclick="toggleLang()">دری</button><a class="btn btn-light" href="/restaurants.html" data-i18n="restaurants"></a></div></div></header><main class="section soft"><div class="container"><div class="form-card"><h1 data-i18n="checkout"></h1><div id="checkoutError" class="notice error hidden"></div><form onsubmit="placeOrder(event)"><div class="grid2"><label class="field"><span data-i18n="name"></span><input name="name" required minlength="2"></label><label class="field"><span data-i18n="phone"></span><input name="phone" type="tel" required placeholder="+93"></label><label class="field"><span data-i18n="district"></span><select name="district" required><option>Herat City</option><option>Jebrael</option><option>Injil</option><option>Guzara</option><option>District 5</option></select></label><label class="field"><span data-i18n="schedule"></span><select name="schedule"><option data-i18n="asap"></option><option>18:00–18:30</option><option>18:30–19:00</option></select></label><label class="field full"><span data-i18n="address2"></span><input name="address" required minlength="5"></label><label class="field full"><span>Landmark</span><input name="landmark" placeholder="Near mosque, school, market, etc."></label><label class="field full"><span data-i18n="instructions"></span><textarea name="instructions" rows="3"></textarea></label><label class="field"><span data-i18n="payment"></span><select><option data-i18n="cash"></option></select></label><label class="field"><span data-i18n="promo"></span><div style="display:flex;gap:7px"><input id="promo" placeholder="WELCOME100"><button class="btn btn-light" type="button" onclick="applyPromo()" data-i18n="apply"></button></div><small id="promoMsg"></small></label></div><h2 data-i18n="cart"></h2><div id="cartItems"></div><div class="sum-row"><span data-i18n="subtotal"></span><span id="cartSubtotal"></span></div><div class="sum-row"><span data-i18n="fee"></span><span id="cartDelivery"></span></div><div class="sum-row"><span data-i18n="service"></span><span id="cartService"></span></div><div class="sum-row"><span data-i18n="discount"></span><span id="cartDiscount"></span></div><div class="sum-row total"><span data-i18n="total"></span><span id="cartTotal"></span></div><button class="btn btn-primary" style="width:100%" data-i18n="place"></button></form></div></div></main><script src="/assets/app.js"></script></body></html>
