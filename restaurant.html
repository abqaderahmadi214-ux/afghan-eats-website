<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant menu | Afghan Eats</title><link rel="stylesheet" href="/assets/styles.css"><script src="/config.js"></script></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">AE</span>Afghan Eats</a><nav class="navlinks"><a href="/restaurants.html" data-i18n="restaurants"></a><a href="/orders.html" data-i18n="orders"></a></nav><div class="actions"><button class="lang" onclick="toggleLang()">دری</button><a class="btn btn-primary" href="/checkout.html">🛒 <span class="cart-count badge-count">0</span></a></div></div></header><div id="storeHero"></div><div class="store-tabs"><div class="container" id="storeTabs"></div></div><main class="section soft"><div class="container menu-layout"><section id="menuContent"></section><aside class="cart-panel"><h2 data-i18n="cart"></h2><div id="cartItems"></div><div class="sum-row"><span data-i18n="subtotal"></span><span id="cartSubtotal"></span></div><div class="sum-row"><span data-i18n="fee"></span><span id="cartDelivery"></span></div><div class="sum-row"><span data-i18n="service"></span><span id="cartService"></span></div><div class="sum-row total"><span data-i18n="total"></span><span id="cartTotal"></span></div><a class="btn btn-primary" style="width:100%" href="/checkout.html" data-i18n="checkout"></a></aside></div></main><div class="modal" id="itemModal"><div class="modal-card"><button class="btn btn-light" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><p id="modalDesc" class="muted"></p><h3 id="modalPrice"></h3><button class="btn btn-primary" style="width:100%" onclick="addCurrent()" data-i18n="add"></button></div></div><script src="/assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!restaurants.length)await loadData();const id=new URLSearchParams(location.search).get('id'),r=restaurants.find(x=>x.id===id)||restaurants[0];if(!r){document.getElementById('menuContent').innerHTML='<div class="notice">Restaurant not found.</div>';return}currentRestaurant=r;document.getElementById('storeHero').innerHTML=`<section class="store-hero"><img src="${imageFor(r)}" alt="${displayName(r)}"><div class="store-overlay"><div class="container store-title"><h1>${displayName(r)}</h1><p>${cuisineText(r)}</p><p>★ ${Number(r.rating??r.external_rating??0).toFixed(1)} · ${r.delivery_time_min??25}–${r.delivery_time_max??45} ${t('min')} · ${Number(r.delivery_fee_min||0)===0?t('free'):money(r.delivery_fee_min)}</p><p>${r.address||''}</p></div></div></section>`;const m=await getMenu(r);currentMenuItems=m.items||[];const cats=(m.categories||[]).length?m.categories:[{id:'all',name:'Menu',name_dari:'منو'}];document.getElementById('storeTabs').innerHTML=cats.map((c,i)=>`<button class="chip" onclick="document.getElementById('cat${i}').scrollIntoView()">${lang==='fa'&&c.name_dari?c.name_dari:c.name}</button>`).join('');document.getElementById('menuContent').innerHTML=cats.map((c,i)=>{const its=c.id==='all'?currentMenuItems:currentMenuItems.filter(x=>x.category_id===c.id);return `<section class="menu-section" id="cat${i}"><h2>${lang==='fa'&&c.name_dari?c.name_dari:c.name}</h2>${its.length?its.map(it=>`<div class="menu-item"><div><h3>${lang==='fa'&&it.name_dari?it.name_dari:it.name}</h3><p>${it.description||''}</p><div class="price">${Number(it.price)>0?money(it.price):'Price to confirm'}</div></div><button class="add-btn" ${Number(it.price)<=0?'disabled':''} onclick="openItem('${r.id}','${it.id}')">+</button></div>`).join(''):'<p class="muted">Menu is being confirmed.</p>'}</section>`}).join('');renderCart()});</script></body></html>
